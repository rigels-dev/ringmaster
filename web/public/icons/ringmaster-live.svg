                  <path d="M 428,592 C 428,588 460,588 460,592 L 464,655 L 424,655 Z" />
                  <path id="anim-puppet-3-arm" d="M 432,602 L 414,584" stroke="#B6432A" stroke-width="9" stroke-linecap="round" />
