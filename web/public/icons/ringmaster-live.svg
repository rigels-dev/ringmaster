                  <path d="M 466,316 C 490,310 490,362 464,368 Z" fill="#EFE4CE" />
                  <path d="M 332,276 L 468,276 L 463,372 L 424,442 L 376,442 L 337,372 Z" fill="#EFE4CE" />
