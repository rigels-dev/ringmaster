                    <circle cx="362" cy="348" r="34" fill="#88EAE6" opacity="0.55" />
                    <circle cx="438" cy="348" r="34" fill="#88EAE6" opacity="0.55" />
                  </g>
                  <path d="M 348,374 L 355,392" fill="none" stroke-width="6" />
                  <path d="M 452,374 L 445,392" fill="none" stroke-width="6" />
                  <path d="M 393,314 L 396,326" fill="none" stroke-width="5" />
                  <path d="M 407,314 L 404,326" fill="none" stroke-width="5" />
                  <path id="anim-brow-left" d="M 344,296 L 386,312" stroke-width="9" />
                  <path id="anim-brow-right" d="M 456,296 L 414,312" stroke-width="9" />
                  <path d="M 384,368 L 400,382 L 416,368" fill="none" stroke-width="7" />
                  <path d="M 372,397 Q 406,399 434,380 Q 426,412 388,408 Z" fill="#FFFFFF" stroke-width="6" />
                  <path d="M 366,397 Q 406,400 435,379" fill="none" stroke-width="7" />
                  <path d="M 431,375 L 439,386" fill="none" stroke-width="6" />
                  <path d="M 388,424 L 412,424 L 422,445 L 412,442 L 408,456 L 400,446 L 392,456 L 388,442 L 378,445 Z" fill="#DEAA3B" stroke-width="6" />
                </g>

                <g>
                  <path d="M 326,324 L 342,332 M 388,334 L 412,334 M 458,332 L 474,324" stroke="#1F272E" stroke-width="8" stroke-linecap="round" />
                  <circle cx="364" cy="338" r="27" fill="#1F272E" />
                  <circle id="anim-lens-left" cx="364" cy="338" r="20" fill="url(#lens-grad)" filter="url(#cyan-glow)" />
                  <circle cx="436" cy="338" r="27" fill="#1F272E" />
                  <circle id="anim-lens-right" cx="436" cy="338" r="20" fill="url(#lens-grad)" filter="url(#cyan-glow)" />
                </g>

                <g stroke="#1F272E" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
                  <path d="M 324,162 Q 400,148 476,162 L 462,274 L 338,274 Z" fill="#B6432A" />
                  <g id="anim-golden-ticket" transform="rotate(24 434 214)">
                    <path d="M 412,174 L 422,174 A 6,6 0 0 0 434,174 L 444,174 L 450,180 L 450,242 L 412,242 Z" fill="#DEAA3B" stroke-width="7" />
                    <rect x="420" y="184" width="22" height="46" fill="none" stroke="#9C6B19" stroke-width="3" stroke-dasharray="6 4" />
                  </g>
                  <path d="M 335,244 Q 400,254 465,244 L 462,274 L 338,274 Z" fill="#DEAA3B" />
                  <path d="M 288,264 Q 400,284 512,264 C 516,280 465,292 400,292 C 335,292 284,280 288,264 Z" fill="#B6432A" />
                </g>
              </g>
            </svg>