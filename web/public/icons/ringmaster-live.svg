<svg id="ringmaster-live-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" class="drop-shadow-2xl">
              <defs>
                <filter id="cyan-glow" x="-40%" y="-40%" width="180%" height="180%">
                  <feGaussianBlur id="glow-blur-node" stdDeviation="6" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <radialGradient id="lens-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#99FFFF" />
                  <stop offset="60%" stop-color="#29F2EC" />
                  <stop offset="100%" stop-color="#14C2BD" />
                </radialGradient>

                <clipPath id="ring-outer-clip">
                  <circle cx="400" cy="400" r="245" />
                </clipPath>

                <clipPath id="face-clip">
                  <path d="M 332,276 L 468,276 L 463,372 L 424,442 L 376,442 L 337,372 Z" />
                </clipPath>

                <g id="gear-tooth">
                  <polygon points="362,66 438,66 452,130 348,130" fill="#DEAA3B" />
                </g>

                <g id="ring-divider">
                  <rect x="394" y="148" width="12" height="42" fill="#1F272E" />
                </g>
              </defs>

              <rect id="svg-bg-rect" width="800" height="800" rx="40" fill="#232B33" />

              <!-- Outer Golden Gear -->
              <g id="anim-outer-gear" transform="rotate(0 400 400)">
                <use href="#gear-tooth" transform="rotate(0 400 400)" />
                <use href="#gear-tooth" transform="rotate(30 400 400)" />
                <use href="#gear-tooth" transform="rotate(60 400 400)" />
                <use href="#gear-tooth" transform="rotate(90 400 400)" />
                <use href="#gear-tooth" transform="rotate(120 400 400)" />
                <use href="#gear-tooth" transform="rotate(150 400 400)" />
                <use href="#gear-tooth" transform="rotate(180 400 400)" />
                <use href="#gear-tooth" transform="rotate(210 400 400)" />
                <use href="#gear-tooth" transform="rotate(240 400 400)" />
                <use href="#gear-tooth" transform="rotate(270 400 400)" />
                <use href="#gear-tooth" transform="rotate(300 400 400)" />
                <use href="#gear-tooth" transform="rotate(330 400 400)" />
                <circle cx="400" cy="400" r="286" fill="#DEAA3B" />
              </g>

              <!-- Segmented Terracotta Ring -->
              <circle cx="400" cy="400" r="256" fill="#1F272E" />
