                <use href="#ring-divider" transform="rotate(0 400 400)" />
                <use href="#ring-divider" transform="rotate(30 400 400)" />
                <use href="#ring-divider" transform="rotate(60 400 400)" />
                <use href="#ring-divider" transform="rotate(90 400 400)" />
                <use href="#ring-divider" transform="rotate(120 400 400)" />
                <use href="#ring-divider" transform="rotate(150 400 400)" />
                <use href="#ring-divider" transform="rotate(180 400 400)" />
                <use href="#ring-divider" transform="rotate(210 400 400)" />
                <use href="#ring-divider" transform="rotate(240 400 400)" />
                <use href="#ring-divider" transform="rotate(270 400 400)" />
                <use href="#ring-divider" transform="rotate(300 400 400)" />
                <use href="#ring-divider" transform="rotate(330 400 400)" />
              </g>
              <circle cx="400" cy="400" r="222" fill="#1F272E" />

              <!-- Worker Puppets -->
              <g clip-path="url(#ring-outer-clip)">
