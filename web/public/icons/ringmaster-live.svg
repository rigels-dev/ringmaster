                <path d="M 218,435 C 216,492 284,496 296,455 L 280,425 Z" fill="#B6432A" />
                <path d="M 582,435 C 584,492 516,496 504,455 L 520,425 Z" fill="#B6432A" />
                <path d="M 336,385 L 302,412 L 368,504 L 400,472 L 432,504 L 498,412 L 464,385 Z" fill="#DEAA3B" />
                <polygon points="362,435 438,435 415,518 385,518" fill="#1F272E" />
                <polygon points="370,458 386,482 378,505" fill="#B6432A" stroke-width="5" />
                <polygon points="430,458 414,482 422,505" fill="#B6432A" stroke-width="5" />
                <path d="M 386,490 A 15,15 0 1 1 414,490 L 418,520 L 382,520 Z" fill="#DEAA3B" stroke-width="7" />
                <circle cx="400" cy="485" r="5" fill="#1F272E" stroke="none" />
                <polygon points="396,488 404,488 406,510 394,510" fill="#1F272E" stroke="none" />
              </g>

              <!-- Strings Rendered In Front of Torso -->
              <g id="anim-strings-group" stroke="#3DF5F0" stroke-width="4.5" stroke-linecap="round" filter="url(#cyan-glow)">
                <line id="str-L1" x1="205" y1="412" x2="208" y2="518" />
                <line id="str-L2" x1="306" y1="420" x2="316" y2="552" />
                <line id="str-L3" x1="316" y1="422" x2="356" y2="566" />
                <line id="str-R3" x1="484" y1="422" x2="444" y2="566" />
                <line id="str-R2" x1="494" y1="420" x2="484" y2="552" />
                <line id="str-R1" x1="595" y1="412" x2="592" y2="518" />
              </g>
              <g id="anim-strings-packets" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
                <line id="pkt-L1" x1="205" y1="412" x2="208" y2="518" class="string-energy-overlay" />
                <line id="pkt-L2" x1="306" y1="420" x2="316" y2="552" class="string-energy-overlay" />
                <line id="pkt-L3" x1="316" y1="422" x2="356" y2="566" class="string-energy-overlay" />
                <line id="pkt-R3" x1="484" y1="422" x2="444" y2="566" class="string-energy-overlay" />
                <line id="pkt-R2" x1="494" y1="420" x2="484" y2="552" class="string-energy-overlay" />
                <line id="pkt-R1" x1="595" y1="412" x2="592" y2="518" class="string-energy-overlay" />
              </g>

              <!-- Left Hand & Control Bars -->
              <g id="anim-hand-left" stroke="#1F272E" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
                <polygon points="196,396 226,403 224,418 193,411" fill="#DEAA3B" />
                <polygon points="282,402 326,412 323,427 279,417" fill="#DEAA3B" />
                <line id="bar-bridge-L" x1="308" y1="422" x2="316" y2="442" stroke="#3DF5F0" stroke-width="4.5" filter="url(#cyan-glow)" />
                <polygon points="278,425 328,442 323,457 273,440" fill="#DEAA3B" />
                <path d="M 222,430 C 226,460 278,460 282,430 Z" fill="#EFE4CE" />
                <path d="M 218,392 C 218,378 232,374 242,378 C 248,374 260,374 266,378 C 278,378 288,386 288,398 C 288,408 282,414 276,414 L 276,430 C 276,436 220,436 220,426 Z" fill="#EFE4CE" />
                <line x1="238" y1="400" x2="238" y2="432" stroke-width="7" />
                <line x1="256" y1="400" x2="256" y2="432" stroke-width="7" />
                <path d="M 274,400 L 274,430" stroke-width="7" />
              </g>

              <!-- Right Hand & Control Bars -->
              <g id="anim-hand-right" stroke="#1F272E" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
                <polygon points="604,396 574,403 576,418 607,411" fill="#DEAA3B" />
                <polygon points="518,402 474,412 477,427 521,417" fill="#DEAA3B" />
                <line id="bar-bridge-R" x1="492" y1="422" x2="484" y2="442" stroke="#3DF5F0" stroke-width="4.5" filter="url(#cyan-glow)" />
                <polygon points="522,425 472,442 477,457 527,440" fill="#DEAA3B" />
                <path d="M 578,430 C 574,460 522,460 518,430 Z" fill="#EFE4CE" />
                <path d="M 582,392 C 582,378 568,374 558,378 C 552,374 540,374 534,378 C 522,378 512,386 512,398 C 512,408 518,414 524,414 L 524,430 C 524,436 580,436 580,426 Z" fill="#EFE4CE" />
                <line x1="562" y1="400" x2="562" y2="432" stroke-width="7" />
                <line x1="544" y1="400" x2="544" y2="432" stroke-width="7" />
                <path d="M 526,400 L 526,430" stroke-width="7" />
              </g>

              <!-- Head, Goggles & Top Hat -->
              <g id="anim-head-group">
