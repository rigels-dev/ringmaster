                  <path d="M 298,580 C 298,576 334,576 334,580 L 338,645 L 294,645 Z" />
                  <path id="anim-puppet-1-arm" d="M 286,562 L 302,586" stroke="#B6432A" stroke-width="10" stroke-linecap="round" />
                </g>
                <g id="anim-puppet-2" fill="#DEAA3B">
                  <circle cx="356" cy="576" r="12" />
                  <path d="M 340,592 C 340,588 372,588 372,592 L 376,655 L 336,655 Z" />
                  <path id="anim-puppet-2-arm" d="M 368,602 L 386,584" stroke="#DEAA3B" stroke-width="9" stroke-linecap="round" />
                </g>
                <g id="anim-puppet-3" fill="#B6432A">
