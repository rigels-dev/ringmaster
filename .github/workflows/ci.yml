name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lockfile uses the public npm registry
        run: |
          if grep '"resolved": "' web/package-lock.json | grep -qv '"resolved": "https://registry.npmjs.org/'; then
            echo "::error file=web/package-lock.json::It points at a private npm mirror; run 'make lockfile' and commit it."
            exit 1
          fi
      - name: Go tests
        run: make test
      - name: Web tests
        run: make test-web
      - name: Web build
        run: make web
