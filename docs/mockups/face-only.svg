<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <defs>
    <!-- Background netral gelap agar fokus 100% pada wajah -->
    <radialGradient id="facePlateBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#24141d"/>
      <stop offset="100%" stop-color="#0c050a"/>
    </radialGradient>

    <!-- Cyan Glow Mata Mekanik -->
    <filter id="cyanGlowExact" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CONTAINER BULAT POLOS -->
  <circle cx="100" cy="100" r="96" fill="url(#facePlateBg)" stroke="#3d212b" stroke-width="3"/>

  <!-- FOCUS: THE FACE OF COGLIOSTRO KETTLE -->
  <g id="kettle-face-only" transform="translate(0, 0)">

    <!-- 1. BENTUK DASAR KEPALA (Kayu Ukir Ochre-Tan) -->
    <!-- Rahang & Tulang Pipi Menonjol -->
    <polygon points="100,56 138,68 144,95 136,128 118,154 100,164 82,154 64,128 56,95 62,68" 
             fill="#c5a96f" stroke="#362018" stroke-width="2.5"/>
    
    <!-- Sisi Terang (Pipi Kanan - Highlights Kayu Gading) -->
    <polygon points="100,59 134,70 138,95 130,124 114,148 100,158" fill="#e2d7a4"/>
    
    <!-- Sisi Gelap (Pipi Kiri - Bayangan Kayu Tua) -->
    <polygon points="100,59 66,70 62,95 70,124 86,148 100,158" fill="#9b8059"/>

    <!-- 2. KERUTAN & TEKSTUR TULANG PIPI TINGGI (High Cheekbones) -->
    <path d="M 68,104 Q 78,114 84,124" fill="none" stroke="#6b5336" stroke-width="2" stroke-linecap="round"/>
    <path d="M 132,104 Q 122,114 116,124" fill="none" stroke="#6b5336" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Kerutan Dahi Panggung -->
    <path d="M 85,74 Q 100,70 115,74" fill="none" stroke="#7a6241" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 88,80 Q 100,77 112,80" fill="none" stroke="#7a6241" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 3. RONGGA MATA & ALIS DRAMATIS ASIMETRIS -->
    <!-- Alis Kiri (Melengkung naik tinggi jahat) -->
    <path d="M 66,82 Q 78,70 92,78" fill="none" stroke="#24110c" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Rongga Mata Kiri Gelap -->
    <ellipse cx="80,90" rx="7.5" ry="6" fill="#141a18" stroke="#24110c" stroke-width="1.5"/>
    <!-- Lensa Mata Kiri Cyan Menyala -->
    <circle cx="81,90" r="3.6" fill="#33dde5" filter="url(#cyanGlowExact)"/>
    <circle cx="81,90" r="1.5" fill="#ffffff"/>

    <!-- Alis Kanan (Lebih menukik tajam) -->
    <path d="M 108,78 Q 122,70 134,82" fill="none" stroke="#24110c" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Rongga Mata Kanan Gelap -->
    <ellipse cx="120,90" rx="7.5" ry="6" fill="#141a18" stroke="#24110c" stroke-width="1.5"/>
    <!-- Lensa Mata Kanan Cyan Menyala -->
    <circle cx="119,90" r="3.6" fill="#33dde5" filter="url(#cyanGlowExact)"/>
    <circle cx="119,90" r="1.5" fill="#ffffff"/>

    <!-- 4. HIDUNG BENGKOK RUNCING (Prominent Hooked Hawk Nose) -->
    <!-- Batang hidung sampai ujung paruh bengkok -->
    <polygon points="98,82 101,108 94,116 100,119 106,115 102,82" fill="#7a6241"/>
    <polygon points="100,82 102,82 106,115 100,119" fill="#f1f7cb"/>
    <line x1="94" y1="116" x2="100" y2="119" stroke="#362018" stroke-width="1.2"/>

    <!-- 5. KUMIS TIPIS MELENGKUNG (Curled Showman Mustache) -->
    <!-- Kumis cokelat kayu tua menukik di atas senyum -->
    <path d="M 74,124 Q 88,116 100,123 Q 112,116 126,124 Q 134,128 138,124" 
          fill="none" stroke="#2e1910" stroke-width="3.2" stroke-linecap="round"/>

    <!-- 6. SENYUM MENYERINGAI LEBAR (Wide Manic Grin) -->
    <!-- Rongga Mulut Dalam Gelap -->
    <path d="M 76,127 Q 100,150 124,127 Q 100,135 76,127 Z" fill="#190704" stroke="#2e1910" stroke-width="1.5"/>
    <!-- Deretan Gigi Kayu Runcing/Gading Terbuka -->
    <path d="M 80,128 Q 100,140 120,128 L 118,132 Q 100,144 82,132 Z" fill="#ffffe0"/>
    <!-- Garis Celah Gigi Individual -->
    <line x1="93" y1="130" x2="93" y2="135" stroke="#452a1a" stroke-width="1"/>
    <line x1="100" y1="131" x2="100" y2="137" stroke="#452a1a" stroke-width="1"/>
    <line x1="107" y1="130" x2="107" y2="135" stroke="#452a1a" stroke-width="1"/>

    <!-- 7. SAMBUNGAN RAHANG VENTRILOQUIST (Marionette Jaw Seams) -->
    <!-- Dua garis vertikal tegas di bawah sudut mulut -->
    <line x1="82" y1="138" x2="84" y2="156" stroke="#24110c" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="118" y1="138" x2="116" y2="156" stroke="#24110c" stroke-width="2.8" stroke-linecap="round"/>

    <!-- 8. JANGGUT RUNCING KAYU GADING (Pointed Carved Goatee) -->
    <polygon points="100,146 108,152 106,170 100,176 94,170 92,152" fill="#785d43" stroke="#24110c" stroke-width="1.5"/>
    <polygon points="100,158 105,160 103,172 100,176 97,172 95,160" fill="#f5eb90"/>

  </g>
</svg>
