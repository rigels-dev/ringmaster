# Ringmaster Configuration Example

[providers.claude_subscription]
type = "claude_subscription"

[providers.openai]
type = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.claude]
type = "anthropic"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"

[providers.9router]
type = "openai"
base_url = "http://localhost:20128/v1"
api_key_env = "NINEROUTER_API_KEY"

[agents.master]
provider = "claude_subscription"
model = "sonnet"
role = "master"

[agents.coder-fast]
provider = "claude_subscription"
model = "haiku"
role = "worker"
tool_calling = true

[routing]
default_master = "master"
default_worker = "coder-fast"

[budget]
max_tokens_per_project = 2000000
max_tokens_per_task = 300000

[sandbox]
acceptance_timeout = 300   # seconds each acceptance command may run
# Commands see only a built-in set of environment variables (PATH, HOME,
# toolchain paths, proxies). Name any others they need; a trailing * is a prefix.
# pass_env = ["DATABASE_URL", "AWS_*"]
# Changes a worker makes to test files that already exist are undone before
# acceptance runs. Set allow_test_edits to lift that, or test_files to say
# which files count as tests ("name/" is a directory, the rest file-name globs).
# allow_test_edits = true
# test_files = ["*_test.go", "tests/"]
allow = [
  "pytest",
  "ruff",
  "mypy",
  "python",
  "node",
  "npm",
  "go test",
  "git status",
  "git diff"
]

# Port for the web UI (default 2053). A project can set its own in its
# ringmaster.toml; --port and RINGMASTER_PORT override both.
# [web]
# port = 2053

# Skills (folders holding a SKILL.md) live in the skills/ directory next to this
# file and are on until listed here. See "ringmaster skills".
# [skills]
# disabled = ["deploy"]
