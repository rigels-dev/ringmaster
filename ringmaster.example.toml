# Ringmaster Configuration Example

[providers.claude_subscription]
type = "claude_subscription"

[providers.openai]
type = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.claude]
type = "anthropic"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"

[providers.9router]
type = "openai"
base_url = "http://localhost:20128/v1"
api_key_env = "NINEROUTER_API_KEY"

[agents.master]
provider = "claude_subscription"
model = "sonnet"
role = "master"

[agents.coder-fast]
provider = "claude_subscription"
model = "haiku"
role = "worker"
tool_calling = true

[routing]
default_master = "master"
default_worker = "coder-fast"

[budget]
max_tokens_per_project = 2000000
max_tokens_per_task = 300000

[sandbox]
acceptance_timeout = 300   # seconds each acceptance command may run
allow = [
  "pytest",
  "ruff",
  "mypy",
  "python",
  "node",
  "npm",
  "go test",
  "git status",
  "git diff"
]
